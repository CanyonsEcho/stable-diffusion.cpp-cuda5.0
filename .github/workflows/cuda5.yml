name: Build CUDA sm50

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Checkout exact stable-diffusion.cpp revision
        shell: pwsh
        run: |
          git fetch --all --tags
          git checkout 3f8527a
          git submodule update --init --recursive

          $commit = git rev-parse HEAD

          Write-Host "stable-diffusion.cpp commit: $commit"

          if (-not $commit.StartsWith("3f8527a")) {
            throw "Wrong stable-diffusion.cpp revision: $commit"
          }

          Write-Host "Correct revision confirmed."

      - name: Setup CUDA 12.4.1
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: '12.4.1'

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DSD_CUDA=ON `
            -DCMAKE_CUDA_ARCHITECTURES=50 `
            -DCMAKE_CUDA_FLAGS="--allow-unsupported-compiler" `
            -DSD_BUILD_EXAMPLES=ON

      - name: Build
        shell: pwsh
        run: |
          cmake --build build `
            --config Release `
            --parallel 2

      - name: Locate CUDA backend
        shell: pwsh
        run: |
          $dll = Get-ChildItem `
            -Path build `
            -Recurse `
            -Filter "ggml-cuda.dll" |
            Select-Object -First 1

          if (-not $dll) {
            throw "ggml-cuda.dll was not produced."
          }

          Write-Host "Found CUDA backend:"
          Write-Host $dll.FullName
          Write-Host "Size: $($dll.Length) bytes"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path artifact | Out-Null

          Copy-Item `
            $dll.FullName `
            "artifact\ggml-cuda.dll"

      - name: Upload CUDA backend
        uses: actions/upload-artifact@v4
        with:
          name: sd-cuda-sm50
          path: artifact\ggml-cuda.dll
          if-no-files-found: error
