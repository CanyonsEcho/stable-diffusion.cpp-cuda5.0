name: Build CUDA sm50

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Checkout exact stable-diffusion.cpp revision
        shell: pwsh
        run: |
          git fetch --all --tags
          git checkout 3f8527a
          git submodule update --init --recursive

          $commit = git rev-parse HEAD

          Write-Host "stable-diffusion.cpp commit:"
          Write-Host $commit

          if (-not $commit.StartsWith("3f8527a")) {
            throw "Wrong stable-diffusion.cpp revision: $commit"
          }

          Write-Host "Correct revision confirmed."

      - name: Setup CUDA 12.4.1
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: '12.4.1'

      - name: Activate MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Show tool versions
        shell: pwsh
        run: |
          nvcc --version
          cmake --version
          cl

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DSD_CUDA=ON `
            -DCMAKE_CUDA_ARCHITECTURES=50 `
            -DCMAKE_CUDA_FLAGS="--allow-unsupported-compiler" `
            -DSD_BUILD_EXAMPLES=ON `
            -DSD_BUILD_SHARED_GGML_LIB=ON

      - name: Build
        shell: pwsh
        run: |
          cmake --build build `
            --config Release `
            --parallel 2

      - name: Locate all build DLLs
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "ALL DLL OUTPUTS"
          Write-Host "========================================"

          $dlls = Get-ChildItem `
            -Path build `
            -Recurse `
            -File `
            -Filter "*.dll"

          if (-not $dlls) {
            throw "Build completed but produced no DLL files."
          }

          foreach ($dll in $dlls) {
            Write-Host "$($dll.FullName) [$($dll.Length) bytes]"
          }

      - name: Locate CUDA backend
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "SEARCHING FOR CUDA BACKEND"
          Write-Host "========================================"

          $cudaDlls = Get-ChildItem `
            -Path build `
            -Recurse `
            -File `
            -Filter "*.dll" |
            Where-Object {
              $_.Name -match "cuda"
            }

          if (-not $cudaDlls) {
            Write-Host ""
            Write-Host "No DLL containing 'cuda' was found."
            Write-Host ""
            Write-Host "DLLs actually produced:"

            Get-ChildItem `
              -Path build `
              -Recurse `
              -File `
              -Filter "*.dll" |
              Select-Object FullName, Length |
              Format-Table -AutoSize

            throw "CUDA backend DLL was not found."
          }

          Write-Host ""
          Write-Host "CUDA DLL candidates:"

          foreach ($dll in $cudaDlls) {
            Write-Host "$($dll.FullName) [$($dll.Length) bytes]"
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path artifact | Out-Null

          $cudaDll = $cudaDlls |
            Where-Object { $_.Name -eq "ggml-cuda.dll" } |
            Select-Object -First 1

          if (-not $cudaDll) {
            $cudaDll = $cudaDlls | Select-Object -First 1
          }

          Write-Host ""
          Write-Host "Selected:"
          Write-Host $cudaDll.FullName

          Copy-Item `
            $cudaDll.FullName `
            "artifact\ggml-cuda.dll"

      - name: Upload CUDA backend
        uses: actions/upload-artifact@v4
        with:
          name: sd-cuda-sm50
          path: artifact\ggml-cuda.dll
          if-no-files-found: error
