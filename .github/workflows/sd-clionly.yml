name: Build sd-cli only

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DSD_CUDA=ON

      - name: Build sd-cli only
        run: |
          cmake --build build --config Release --target sd-cli --parallel

      - name: Upload sd-cli
        uses: actions/upload-artifact@v4
        with:
          name: sd-cli
          path: |
            build/bin/Release/sd-cli.exe
            build/bin/Release/*.dll
