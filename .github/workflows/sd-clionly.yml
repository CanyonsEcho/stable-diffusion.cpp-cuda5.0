name: Build sd-cli only

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build sd-cli only
        run: cmake --build build --target sd-cli --parallel

      - name: Upload sd-cli
        uses: actions/upload-artifact@v4
        with:
          name: sd-cli
          path: build/bin/sd-cli.exe
